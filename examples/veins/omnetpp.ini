[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images
network = RSUExampleScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true
sim-time-limit = 200s
seed-set = 0

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
# Obstacle parameters                                    #
##########################################################
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("erlangen.launchd.xml")
*.manager.trafficLightModuleType = "org.car2x.veins.nodes.TrafficLight"

*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 3

*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType = "org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"

##########################################################
#                       RSU SETTINGS                     #
##########################################################
*.rsu[0].mobility.x = 2000
*.rsu[0].mobility.y = 2000
*.rsu[0].mobility.z = 3

*.rsu[*].applType = "TraCIDemoRSU11p"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m
*.rsu[*].appl.denmDefaultCause = -1

##########################################################
#            11p specific parameters                     #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm

*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm

*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true

*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].applType = "TraCIDemo11p"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].appl.denmDefaultCause = -1
*.node[*].appl.denmDefaultSubcause = 0

##########################################################
#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

##########################################################
#                      Configs                           #
##########################################################

[Config Default]

[Config WithBeaconing]
*.rsu[*].appl.sendBeacons = true
*.node[*].appl.sendBeacons = true

[Config WithChannelSwitching]
*.**.nic.mac1609_4.useServiceChannel = true
*.node[*].appl.dataOnSch = true
*.rsu[*].appl.dataOnSch = true

# ===========================================================
#                     DENM SCENARIOS
# ===========================================================

# Cause 2 — Veicolo si ferma bruscamente (incidente)
[Config DenmAccident]
description = "Road accident scenario (causeCode=2)"
*.node[*0].veinsmobility.accidentCount = 1
*.node[*0].veinsmobility.accidentStart = 10s
*.node[*0].veinsmobility.accidentDuration = 50s
*.node[*].appl.denmDefaultCause = 2
*.node[*].appl.denmDefaultSubcause = 0

# Cause 1 — Condizioni di traffico (nessun stop fisico, DENM periodico)
[Config DenmTrafficCondition]
description = "Traffic conditions scenario (causeCode=1)"
*.node[*].appl.denmDefaultCause = 1
*.node[*].appl.denmDefaultSubcause = 0

# Cause 3 — Lavori in corso (triggerato dall'RSU)
[Config DenmRoadworks]
description = "Roadworks scenario (causeCode=3)"
*.rsu[*].appl.denmDefaultCause = 3
*.node[*].appl.denmDefaultCause = 3
*.node[*].appl.denmDefaultSubcause = 0

# Cause 26 — Veicolo lento (si ferma quasi del tutto)
[Config DenmSlowVehicle]
description = "Slow vehicle scenario (causeCode=26)"
*.node[*0].veinsmobility.accidentCount = 1
*.node[*0].veinsmobility.accidentStart = 10s
*.node[*0].veinsmobility.accidentDuration = 50s
*.node[*].appl.denmDefaultCause = 26
*.node[*].appl.denmDefaultSubcause = 0

# Cause 94 — Veicolo fermo (stazionario)
[Config DenmStationaryVehicle]
description = "Stationary vehicle scenario (causeCode=94)"
*.node[*0].veinsmobility.accidentCount = 1
*.node[*0].veinsmobility.accidentStart = 10s
*.node[*0].veinsmobility.accidentDuration = 100s
*.node[*].appl.denmDefaultCause = 94
*.node[*].appl.denmDefaultSubcause = 0

# Cause 97 — Rischio collisione (nessun stop fisico, DENM periodico)
[Config DenmCollisionRisk]
description = "Collision risk scenario (causeCode=97)"
*.node[*].appl.denmDefaultCause = 97
*.node[*].appl.denmDefaultSubcause = 0

# Cause 92 — Post crash
[Config DenmPostCrash]
description = "Post crash scenario (causeCode=92)"
*.node[*0].veinsmobility.accidentCount = 1
*.node[*0].veinsmobility.accidentStart = 10s
*.node[*0].veinsmobility.accidentDuration = 50s
*.node[*].appl.denmDefaultCause = 92
*.node[*].appl.denmDefaultSubcause = 0

# Cause 91 — Guasto veicolo
[Config DenmVehicleBreakdown]
description = "Vehicle breakdown scenario (causeCode=91)"
*.node[*0].veinsmobility.accidentCount = 1
*.node[*0].veinsmobility.accidentStart = 10s
*.node[*0].veinsmobility.accidentDuration = 80s
*.node[*].appl.denmDefaultCause = 91
*.node[*].appl.denmDefaultSubcause = 0

# Cause 14 — Guida contromano (nessun stop fisico, DENM periodico)
[Config DenmWrongWayDriving]
description = "Wrong way driving scenario (causeCode=14)"
*.node[*].appl.denmDefaultCause = 14
*.node[*].appl.denmDefaultSubcause = 0

# Cause 95 — Veicolo di emergenza in avvicinamento
[Config DenmEmergencyVehicle]
description = "Emergency vehicle approaching scenario (causeCode=95)"
*.node[*].appl.denmDefaultCause = 95
*.node[*].appl.denmDefaultSubcause = 0

# Cause 99 — Situazione pericolosa generica
[Config DenmDangerousSituation]
description = "Dangerous situation scenario (causeCode=99)"
*.node[*].appl.denmDefaultCause = 99
*.node[*].appl.denmDefaultSubcause = 0